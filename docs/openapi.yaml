openapi: 3.0.0
info:
  title: Ghost Ops API
  version: 0.4.0
  description: API for Ghost Ops platform.
paths:
  /services:
    get:
      summary: List all services
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRecord'
  /services/{id}/logs:
    get:
      summary: Get service logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service logs
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Service not found
  /services/{id}/invoke:
    post:
      summary: Invoke a service method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
            default: default
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Invocation result
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: Invocation failed
  /reconcile:
    post:
      summary: Trigger reconciliation
      responses:
        '200':
          description: Reconciliation completed
  /metrics:
    get:
      summary: Get metrics
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                type: object
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
components:
  schemas:
    ServiceRecord:
      type: object
      properties:
        service_id:
          type: string
        version:
          type: integer
        active_version:
          type: integer
        wasm_hash:
          type: string
        active_wasm_hash:
          type: string
        synthesis_timestamp:
          type: string
          format: date-time
        current_state:
          type: string
        dependencies:
          type: array
          items:
            type: string
